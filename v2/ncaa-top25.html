<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PVHSN • AP Top 25</title>
<link rel="stylesheet" href="core/pvhsn.css">
<style>
  .sum{height:40px;display:flex;align-items:center;gap:30px;font-family:"BC";font-weight:700;font-size:21px;letter-spacing:3px;color:var(--faint)}
  .sum b{color:var(--ink)}
  .sum .key{margin-left:auto;display:flex;gap:24px}
  .grid{position:absolute;left:0;right:0;top:56px;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);grid-auto-flow:column;gap:16px 20px}
  .c{background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px 0 0;min-width:0;position:relative;overflow:hidden}
  .c .chip{width:10px;height:100%;flex:none}
  .rk{font-family:"BC";font-weight:800;font-size:48px;color:var(--amber);width:54px;text-align:center;flex:none;line-height:1}
  .c .logo,.c .initials{flex:none}
  .info{min-width:0;flex:1}
  .nm{font-family:"BC";font-weight:800;font-size:29px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{display:flex;gap:14px;align-items:center;margin-top:6px;font-family:"BC";font-weight:600;font-size:21px;letter-spacing:1px;color:var(--dim)}
  .mv{font-family:"BC";font-weight:800;font-size:22px;letter-spacing:1px}
  .mv.up{color:var(--green)} .mv.dn{color:var(--red)} .mv.eq{color:var(--faint)} .mv.new{color:var(--blue)}
  .fpv{position:absolute;right:12px;top:10px;font-family:"BC";font-weight:700;font-size:17px;letter-spacing:1px;color:var(--amber)}
  .c .la-tag{position:absolute;right:12px;bottom:12px;margin:0}
</style>
</head>
<body>
<div id="stage"><div class="body">
  <div class="sum"><span id="when"></span><span class="key"><span class="mv up">&#9650; MOVED UP</span><span class="mv dn">&#9660; MOVED DOWN</span><span class="mv new">NEW</span><span style="color:var(--amber)">( ) FIRST-PLACE VOTES</span></span></div>
  <div class="grid" id="grid"></div>
</div></div>
<script src="core/pvhsn.js"></script>
<script>
(function () {
  var URL = "https://site.api.espn.com/apis/site/v2/sports/football/college-football/rankings";
  PV.frame({ title: "AP TOP 25 &bull; <em>COLLEGE FOOTBALL</em>", source: "SOURCE: AP POLL VIA ESPN" });

  function move(r) {
    if (!r.previous) return '<span class="mv new">NEW</span>';
    var d = r.previous - r.current;
    if (d > 0) return '<span class="mv up">&#9650; ' + d + "</span>";
    if (d < 0) return '<span class="mv dn">&#9660; ' + (-d) + "</span>";
    return '<span class="mv eq">&mdash;</span>';
  }
  function render(data) {
    var polls = data.rankings || [], ap = null;
    polls.forEach(function (p) { if (!ap && /AP/i.test(p.name || "")) ap = p; });
    ap = ap || polls[0];
    if (!ap) { PV.message("RANKINGS LOADING", "RETRYING AUTOMATICALLY"); return; }
    var week = (/Week\s*(\d+)/i.exec(ap.headline || ap.shortHeadline || "") || [])[1];
    document.getElementById("when").innerHTML = (week ? "<b>WEEK " + week + "</b> &bull; " : "") +
      "RELEASED " + PV.fmt(new Date(ap.date), { weekday: "short", month: "short", day: "numeric" }).toUpperCase();
    document.getElementById("grid").innerHTML = (ap.ranks || []).slice(0, 25).map(function (r) {
      var t = r.team || {}, la = PV.isLA("ncaa", String(t.id));
      var name = t.location || t.nickname || t.name || "";
      if (name.length > 12 && t.nickname) name = t.nickname;   // "Mississippi State" -> "Mississippi St"
      return '<div class="c' + (la ? " la-card" : "") + '"><span class="chip" style="background:' + PV.hex(t.color) + '"></span>' +
        '<div class="rk num">' + r.current + "</div>" + PV.logo("ncaa", t.id, t.abbreviation, PV.hex(t.color), 60) + '<div class="info"><div class="nm">' + PV.esc(name.toUpperCase()) + "</div>" +
        '<div class="meta"><span class="num">' + PV.esc(r.recordSummary || "") + "</span>" + move(r) + "</div></div>" +
        (r.firstPlaceVotes ? '<span class="fpv">(' + r.firstPlaceVotes + ")</span>" : "") + (la ? '<span class="la-tag">LA</span>' : "") + "</div>";
    }).join("");
  }
  function load() {
    PV.getJSON(URL, "ap-top25", 15000).then(function (res) {
      if (!res) { PV.message("RANKINGS LOADING", "RETRYING AUTOMATICALLY"); return; }
      render(res.data);
      PV.updated(res);
    });
  }
  load();
  setInterval(load, 30 * 60 * 1000);
})();
</script>
</body>
</html>
