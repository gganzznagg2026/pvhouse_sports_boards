<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PVHSN • AP Top 25</title>
  <style>
    :root { --scale: min(100vw / 1920, 100vh / 1080); }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #07111d; color: #f5f8fb; font-family: Arial, Helvetica, sans-serif; }
    body { display: grid; place-items: center; }
    .board { width: 1920px; height: 1080px; transform: scale(var(--scale)); transform-origin: center; padding: 50px 70px 42px; background: radial-gradient(circle at 80% 0%, #183650 0, transparent 32%), linear-gradient(135deg, #07111d 0%, #0c1b2b 52%, #07111d 100%); }
    .masthead { display: flex; justify-content: space-between; align-items: end; border-bottom: 2px solid #6d8397; padding-bottom: 22px; }
    .brand { font-size: 30px; letter-spacing: .16em; font-weight: 800; }
    .location { text-align: right; font-size: 22px; letter-spacing: .08em; color: #d7e4ee; }
    .title-row { display: flex; justify-content: space-between; align-items: end; padding: 27px 0 23px; }
    h1 { margin: 0; font-size: 66px; line-height: .95; letter-spacing: .04em; text-transform: uppercase; }
    .subtitle { margin-top: 12px; color: #a9c3d6; font-size: 23px; letter-spacing: .13em; text-transform: uppercase; }
    .status { text-align: right; color: #c6d6e2; font-size: 22px; line-height: 1.45; }
    .status strong { color: #fff; }
    .rankings { display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-rows: 1fr; gap: 13px; height: 790px; }
    .card { min-width: 0; position: relative; display: grid; grid-template-columns: 63px 88px 1fr; grid-template-rows: 70px 32px; align-items: center; padding: 11px 16px; border: 1px solid rgba(177,205,224,.28); border-left: 7px solid var(--accent, #57788f); border-radius: 5px; background: linear-gradient(145deg, rgba(25,47,67,.98), rgba(9,22,36,.98)); box-shadow: 0 7px 18px rgba(0,0,0,.18); }
    .rank { font-size: 37px; font-weight: 900; color: #e7eef4; }
    .logo { width: 66px; height: 66px; object-fit: contain; }
    .fallback { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; background: var(--accent, #57788f); font-size: 17px; font-weight: 900; }
    .record { font-size: 20px; color: #c1d2de; text-align: right; align-self: start; padding-top: 6px; }
    .name { grid-column: 2 / 4; grid-row: 2; align-self: end; font-size: 20px; font-weight: 900; letter-spacing: .035em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .move { position: absolute; right: 15px; bottom: 11px; font-size: 16px; font-weight: 800; }
    .up { color: #64d79a; } .down { color: #ff9c8d; } .same, .nr { color: #a9bdca; }
    footer { display: flex; justify-content: space-between; color: #91aabd; font-size: 18px; letter-spacing: .08em; padding-top: 19px; }
    @media (max-aspect-ratio: 16/9) { :root { --scale: min(100vw / 1920, 100vh / 1080); } }
  </style>
</head>
<body>
  <main class="board">
    <header class="masthead"><div class="brand">P.V. HOUSE SPORTS NETWORK</div><div class="location">PVHSN • PLAYA VISTA</div></header>
    <section class="title-row"><div><h1>AP Top 25</h1><div class="subtitle">College Football Rankings</div></div><div class="status"><strong id="week">Loading rankings…</strong><br><span id="updated">Checking NCAA.com</span></div></section>
    <section id="rankings" class="rankings" aria-live="polite"></section>
    <footer><span>COLLEGE FOOTBALL LIVES HERE.</span><span>OFFICIAL SOURCE: NCAA.COM • AP POLL</span></footer>
  </main>
  <script>
    const API = "https://pv-house-sports.gian-ganziano.workers.dev/ncaa-rankings";
    const fallback = [
      ["Texas","4-0","1"],["Georgia","4-0","2"],["Notre Dame","4-0","3"],["Miami (FL)","4-0","6"],["Ohio State","3-1","7"],
      ["Indiana","4-0","5"],["Alabama","3-1","8"],["Florida","3-1","21"],["Ole Miss","3-1","4"],["BYU","3-0","10"],
      ["LSU","3-1","11"],["Texas Tech","4-0","12"],["Utah","4-0","17"],["Iowa","4-0","18"],["Oregon","3-1","15"],
      ["Mississippi State","4-0","NR"],["Tennessee","3-1","14"],["Southern Cal","4-1","12"],["Oklahoma State","3-1","NR"],["Houston","3-1","22"],
      ["SMU","3-1","22"],["Boise State","3-1","NR"],["UCLA","4-0","NR"],["Kentucky","3-1","NR"],["Missouri","3-1","20"]
    ].map((item, index) => ({ rank: index + 1, team: item[0], record: item[1], previous: item[2], move: "—", logo: slug(item[0]), abbr: initials(item[0]) }));

    function slug(name) { return ({ "Miami (FL)":"miami", "Southern Cal":"usc" }[name] || name.toLowerCase().replace(/\./g, '').replace(/\s+/g, '-').replace(/\(|\)/g, '')); }
    function initials(name) { return name.split(/\s+/).map(word => word[0]).join('').slice(0, 4).toUpperCase(); }
    function movement(move) { return move === "—" || move === "NR" ? move : move[0] === "+" ? `▲ ${move}` : `▼ ${move.slice(1)}`; }
    function draw(data, isFallback = false) {
      const rankings = isFallback ? data : data.rankings;
      document.getElementById("week").textContent = isFallback ? "AP TOP 25 • FALLBACK" : (data.through || "AP TOP 25").toUpperCase();
      document.getElementById("updated").textContent = isFallback ? "Live source unavailable — showing last known board" : `UPDATED ${new Date(data.updatedAt).toLocaleString("en-US", { timeZone: "America/Los_Angeles", month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" })} PT`;
      document.getElementById("rankings").innerHTML = rankings.map(team => {
        const logoPath = team.logo ? `pvhsn-assets/ncaa/${team.logo}.png` : "";
        return `<article class="card" style="--accent:${accent(team.rank)}"><div class="rank">${team.rank}</div><div>${logoPath ? `<img class="logo" src="${logoPath}" alt="${team.team} logo" onerror="this.outerHTML='<span class=\"fallback\">${team.abbr || initials(team.team)}</span>'">` : `<span class="fallback">${team.abbr || initials(team.team)}</span>`}</div><div class="record">${team.record || ""}</div><div class="name">${team.team.toUpperCase()}</div><div class="move ${team.move === "NR" ? "nr" : team.move?.startsWith("+") ? "up" : team.move?.startsWith("-") ? "down" : "same"}">${movement(team.move || "—")}</div></article>`;
      }).join("");
    }
    function accent(rank) { return rank <= 5 ? "#d0a44d" : rank <= 12 ? "#668eb3" : "#567080"; }
    async function load() { try { const response = await fetch(`${API}?t=${Date.now()}`, { cache: "no-store" }); if (!response.ok) throw new Error("rankings request failed"); draw(await response.json()); } catch (error) { draw(fallback, true); } }
    function nextSundayNoon() {
      const now = new Date();
      const local = new Intl.DateTimeFormat("en-US", { timeZone: "America/Los_Angeles", weekday: "short", hour: "numeric", minute: "numeric", hour12: false }).formatToParts(now).reduce((o, p) => (o[p.type] = p.value, o), {});
      const sunday = local.weekday === "Sun" && Number(local.hour) >= 12;
      const days = sunday ? 7 : (7 - ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(local.weekday)) % 7 || 7;
      const target = new Date(now.getTime() + days * 86400000);
      target.setHours(now.getHours(), now.getMinutes(), now.getSeconds(), 0);
      return target;
    }
    load();
    const nowParts = new Intl.DateTimeFormat("en-US", { timeZone: "America/Los_Angeles", weekday: "short", hour: "numeric", hour12: false }).formatToParts(new Date()).reduce((o, p) => (o[p.type] = p.value, o), {});
    if (nowParts.weekday === "Sun" && Number(nowParts.hour) < 12) setTimeout(() => location.reload(), Math.max(1000, (12 - Number(nowParts.hour)) * 3600000));
    else setTimeout(() => location.reload(), Math.max(60000, nextSundayNoon() - Date.now()));
  </script>
</body>
</html>
